# Morning App - Stage 1: the app and its Postgres database on the office network only (no internet yet).
# In Container Manager: Project > Create, path docker/morningapp (this file and the Dockerfile go there).
# Put the database password in a file called .env next to this file:  POSTGRES_PASSWORD=choose-one
# Layout: docker/morningapp holds this file, the Dockerfile, .env, app/ (the code) and pgdata/.
services:
  web:
    build: .
    image: morning-app-web
    container_name: morning-app-web
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8090
      - TZ=Australia/Brisbane
      - DATABASE_URL=postgres://morning:${POSTGRES_PASSWORD}@db:5432/morning
    ports:
      - "8090:8090"
    volumes:
      - /volume1/docker/morningapp/app:/srv
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: morning-app-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=morning
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=morning
      - TZ=Australia/Brisbane
    volumes:
      - /volume1/docker/morningapp/pgdata:/var/lib/postgresql/data
    # To report from Power BI or Excel on the office network, uncomment the next two lines.
    # ports:
    #   - "5433:5432"
