<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="theme-color" content="#0d7480">
<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}</style>
<title>Morty's Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, day picker strip on top, today's session as a checklist of exercise rows */
:root {
  --bg: #eef3f4; --surface: #ffffff; --ink: #13222b; --muted: #5a6b74; --line: #d5dfe3;
  --accent: #0d7480; --accent-soft: #d6ecee; --done: #2f7d4f; --done-soft: #dcefe3;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f181d; --surface: #172329; --ink: #e4eef1; --muted: #93a6ae; --line: #2a3a42;
  --accent: #4fc0cb; --accent-soft: #173c42; --done: #6fcf97; --done-soft: #1b3a29; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f181d; --surface: #172329; --ink: #e4eef1; --muted: #93a6ae; --line: #2a3a42;
  --accent: #4fc0cb; --accent-soft: #173c42; --done: #6fcf97; --done-soft: #1b3a29; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font: 700 2rem/1.05 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: .95rem; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { font: 600 .95rem var(--display); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 0 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.day .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.day.part .dot { background: var(--accent); }
.day.full .dot { background: var(--done); }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.day[aria-pressed="true"] .dot { background: var(--surface); }
.day:focus-visible, .check:focus-visible, a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.head h2 { font: 700 1.5rem/1.1 var(--display); margin: 0; }
.head .meta { color: var(--muted); font-size: .9rem; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--done); width: 0; transition: width .3s; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group h3 { font: 600 .8rem var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 6px 0 0; }
.item { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.item.is-done { background: var(--done-soft); border-color: transparent; }
.item.is-done .name { text-decoration: line-through; text-decoration-color: var(--done); }
.check { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--accent); background: transparent; cursor: pointer;
  display: grid; place-items: center; padding: 0; color: var(--surface); }
.item.is-done .check { background: var(--done); border-color: var(--done); }
.check svg { width: 18px; height: 18px; opacity: 0; }
.item.is-done .check svg { opacity: 1; }
.body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.name { font-weight: 600; font-size: 1.05rem; }
.dose { font: 600 1rem var(--display); letter-spacing: .03em; color: var(--accent); font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: .9rem; }
.vids { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.vid { display: inline-flex; align-items: center; gap: 5px; font-size: .85rem; font-weight: 600; color: var(--accent);
  background: var(--accent-soft); border-radius: 99px; padding: 4px 10px; text-decoration: none; }
.vid svg { width: 12px; height: 12px; fill: currentColor; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: .85rem; }
.reset { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
.cheer { background: var(--done-soft); color: var(--done); border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tabs a { display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px 2px; border-radius: 9px; font: 600 .85rem/1.1 var(--display); letter-spacing: .03em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
.tabs a[aria-current="page"] { background: var(--accent); color: var(--surface); }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
<style>
:root { --mit: #a8650a; --mit-soft: #fbecd4; --lit: #5b5b9a; --lit-soft: #e9e9f5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --mit: #f0b35a; --mit-soft: #3a2a12; --lit: #a9a9e6; --lit-soft: #26263f; } }
:root[data-theme="dark"] { --mit: #f0b35a; --mit-soft: #3a2a12; --lit: #a9a9e6; --lit-soft: #26263f; }
.date-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.date-row h2 { font: 700 1.5rem/1.1 var(--display); margin: 0; text-align: center; flex: 1; }
.date-row .meta { display: block; color: var(--muted); font: 400 .9rem var(--body); margin-top: 2px; }
.step { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 1.2rem; cursor: pointer; }
.item.mit .check { border-color: var(--mit); }
.item.mit.is-part { border-color: var(--mit); }
.mtag { display: inline-block; font: 700 .72rem/1 var(--body); text-transform: uppercase; letter-spacing: .06em; border-radius: 5px; padding: 3px 6px; margin-right: 6px; vertical-align: 2px; background: var(--mit-soft); color: var(--mit); }
.sstep { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; font-size: .95rem; padding: 4px 0; cursor: pointer; }
.sstep input { width: 20px; height: 20px; accent-color: var(--done); margin: 0; }
.sstep em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; font-size: .85rem; }
.sstep.d span { text-decoration: line-through; color: var(--muted); }
.lit { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; }
.lit input { width: 20px; height: 20px; accent-color: var(--lit); margin: 0; }
.lit.d span { text-decoration: line-through; color: var(--muted); }
.ltag { font: 700 .72rem/1 var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--lit); margin-right: 6px; }
.empty { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 14px; color: var(--muted); }
.warn { background: #fdecea; color: #a12a12; border-radius: 12px; padding: 12px 14px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .warn { background: #3a1d1a; color: #f2a59a; } }
</style>
</head><body>
<div class="wrap">
  <header>
    <h1>Work</h1>
    <p class="sub">Today's MITs and LITs from Mission Control</p>
  </header>
  <nav class="tabs" aria-label="Pages"><a href="work.html">Today</a><a href="soon.html#calendar">Calendar</a><a href="performance.html">Performance</a></nav>
  <section class="date-row">
    <button class="step" id="prev" type="button" aria-label="Previous day">&#8249;</button>
    <h2><span id="dayname"></span><span class="meta" id="daydate"></span></h2>
    <button class="step" id="next" type="button" aria-label="Next day">&#8250;</button>
  </section>
  <main id="list" class="group" aria-live="polite"></main>
  <div class="foot"><span id="saved">Planned in Mission Control. Ticks save straight back to it.</span></div>
</div>
<script>
// Work > Today: the day's MITs (with their timed steps) and LITs from Mission Control's day plan,
// through this app's server (/api/mc/day-plan), so it works from the phone away from the LAN too.
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const z = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
const mins = t => { const [a, b] = t.split(":").map(Number); return a * 60 + (b || 0); };
const nice = m => (Math.floor(m / 60) % 12 || 12) + ":" + z(m % 60) + (m < 720 ? "am" : "pm");
const hm = m => m >= 60 ? Math.floor(m / 60) + "h" + (m % 60 ? " " + (m % 60) + "m" : "") : m + " min";
const block = steps => Math.ceil(steps.reduce((a, s) => a + (+s.min || 0), 0) * 1.15 / 5) * 5;
const today = new Date(); today.setHours(12, 0, 0, 0);
let sel = new Date(today), items = [];
const list = document.getElementById("list"), saved = document.getElementById("saved");

// One save at a time so ticks can't arrive out of order
let saving = Promise.resolve();
function keep(p) {
  saving = saving.then(async () => {
    const r = await fetch("api/mc/day-plan", { method: "PATCH", keepalive: true, headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: p.id, steps: p.steps, done: p.done }) });
    if (!r.ok) throw 0;
    saved.textContent = "Saved to Mission Control.";
  }).catch(() => { saved.textContent = "Couldn't reach Mission Control, so that tick didn't save. Try again in a moment."; });
}

async function load() {
  const k = iso(sel);
  document.getElementById("dayname").textContent = +sel === +today ? "Today" : sel.toLocaleDateString(undefined, { weekday: "long" });
  document.getElementById("daydate").textContent = sel.toLocaleDateString(undefined, { day: "numeric", month: "long" });
  list.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const r = await fetch("api/mc/day-plan?from=" + k + "&to=" + k);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "error");
    items = d.items || [];
    draw();
  } catch (e) {
    list.innerHTML = '<div class="warn">Couldn\'t reach Mission Control. Check it\'s running, then come back to this page.</div>';
  }
}

function draw() {
  list.innerHTML = "";
  const mits = items.filter(i => i.kind === "mit").sort((a, b) => (a.start || "99").localeCompare(b.start || "99"));
  const lits = items.filter(i => i.kind === "lit");
  const h = document.createElement("h3"); h.textContent = "MITs"; list.append(h);
  if (!mits.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "No MITs for this day. Plan them in Mission Control with Make it an MIT."; list.append(e); }
  mits.forEach((m, i) => {
    const done = m.steps.length ? m.steps.every(s => s.done) : m.done, part = !done && m.steps.some(s => s.done);
    const row = document.createElement("div"); row.className = "item mit" + (done ? " is-done" : part ? " is-part" : "");
    const cb = document.createElement("button"); cb.type = "button"; cb.className = "check"; cb.innerHTML = TICK;
    cb.setAttribute("role", "checkbox"); cb.setAttribute("aria-checked", done ? "true" : part ? "mixed" : "false"); cb.setAttribute("aria-label", "MIT " + (i + 1) + " done: " + m.title);
    cb.onclick = () => { const all = !done; m.steps.forEach(s => (s.done = all)); m.done = all; keep(m); draw(); };
    const body = document.createElement("div"); body.className = "body";
    const nm = document.createElement("div"); nm.className = "name";
    const tg = document.createElement("span"); tg.className = "mtag"; tg.textContent = "MIT " + (i + 1); nm.append(tg, m.title); body.append(nm);
    const n = document.createElement("div"); n.className = "note";
    n.textContent = (m.start ? nice(mins(m.start)) + " · " : "") + hm(block(m.steps)) + (m.output ? " · Output: " + m.output : "");
    body.append(n);
    let at = m.start ? mins(m.start) : null;
    m.steps.forEach(s => {
      const r = document.createElement("label"); r.className = "sstep" + (s.done ? " d" : "");
      const c = document.createElement("input"); c.type = "checkbox"; c.checked = !!s.done;
      c.onchange = () => { s.done = c.checked; m.done = m.steps.every(x => x.done); keep(m); draw(); };
      const tx = document.createElement("span"); tx.textContent = s.text;
      const tm = document.createElement("em"); tm.textContent = at === null ? s.min + " min" : nice(at);
      r.append(c, tx, tm); body.append(r); if (at !== null) at += +s.min || 0;
    });
    row.append(cb, body); list.append(row);
  });
  if (lits.length) {
    const h2 = document.createElement("h3"); h2.textContent = "LITs · " + lits.filter(l => l.done).length + " of " + lits.length + " done"; list.append(h2);
    lits.forEach(l => {
      const r = document.createElement("label"); r.className = "lit" + (l.done ? " d" : "");
      const c = document.createElement("input"); c.type = "checkbox"; c.checked = !!l.done;
      c.onchange = () => { l.done = c.checked; keep(l); draw(); };
      const tx = document.createElement("span"); const t = document.createElement("b"); t.className = "ltag"; t.textContent = "LIT";
      tx.append(t, l.title); r.append(c, tx); list.append(r);
    });
  }
}

document.getElementById("prev").onclick = () => { sel.setDate(sel.getDate() - 1); load(); };
document.getElementById("next").onclick = () => { sel.setDate(sel.getDate() + 1); load(); };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
load();
</script>
<script src="nav.js?v=4"></script>
</body></html>
