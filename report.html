<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap">
<style>
  /* One A4 page: MITs and time blocks, gratitude, LITs, habits, a journal line. */
  @page { size: A4 portrait; margin: 12mm; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E9ECE8; color: #17201D; font: 13px/1.4 'DM Sans', system-ui, sans-serif; }
  .bar { display: flex; gap: 8px; justify-content: center; padding: 12px; }
  .bar button { min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #17201D; color: #fff; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
  .page { width: 210mm; min-height: 297mm; margin: 0 auto 24px; background: #fff; padding: 12mm; display: flex; flex-direction: column; gap: 16px; }
  h1, h2 { font-family: Outfit, sans-serif; font-weight: 600; margin: 0; }
  h1 { font-size: 26px; } h2 { font-size: 16px; margin-bottom: 8px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #17201D; padding-bottom: 10px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #55625D; }
  .cols { display: grid; grid-template-columns: 3fr 2fr; gap: 18px; }
  .mit { display: flex; gap: 10px; border: 1.5px solid #E2C48E; border-radius: 8px; padding: 10px; margin-bottom: 8px; break-inside: avoid; }
  .tick { width: 13px; height: 13px; border: 1.5px solid #17201D; border-radius: 3px; flex-shrink: 0; margin-top: 2px; }
  .muted { color: #55625D; font-size: 12px; }
  .block { display: flex; gap: 10px; background: #FBEFD9; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; }
  .block b { width: 92px; flex-shrink: 0; }
  .grat { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .grat div { border-top: 3px solid #1E6B57; padding-top: 6px; min-height: 40px; }
  .list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
  .li { display: flex; gap: 8px; align-items: flex-start; }
  .mitc { color: #7A4A00; } .green { color: #1E6B57; }
  footer { margin-top: auto; border-top: 1px solid #DDE3DE; padding-top: 10px; }
  @media print {
    body { background: #fff; }
    .bar { display: none; }
    .page { width: auto; min-height: auto; margin: 0; padding: 0; }
  }
  @media (max-width: 820px) { .page { width: auto; min-height: 0; margin: 0 8px 16px; padding: 16px; } .cols, .grat { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bar"><button id="print" type="button">Print or save as PDF</button></div>
<article class="page" id="page"><p class="muted">Loading…</p></article>
<script>
"use strict";
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hhmm = t => t ? String(t).slice(0, 5) : "";
const date = new URLSearchParams(location.search).get("date") || "";

async function main() {
  const r = await fetch("/api/day?date=" + encodeURIComponent(date), { credentials: "include", cache: "no-store" });
  if (!r.ok) { document.getElementById("page").innerHTML = '<p>Could not load this day. Please sign in and try again.</p>'; return; }
  const d = await r.json();
  const slot = s => d.tasks.filter(t => t.slot === s);
  const mits = slot("MIT"), lits = slot("LIT"), also = slot("ALSO");
  const blocks = mits.map((t, i) => ({ t, i })).filter(x => x.t.starts_at).sort((a, b) => String(a.t.starts_at).localeCompare(String(b.t.starts_at)));
  const nice = new Date(d.date + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const morning = d.journal.filter(j => j.kind === "morning")[0];
  document.title = "Day report " + d.date;
  document.getElementById("page").innerHTML = `
  <header><div><div class="eyebrow">Day report</div><h1>${esc(nice)}</h1></div>
    <div class="muted">${d.plan && d.plan.confirmed_at ? "Plan confirmed" : "Plan not confirmed yet"}</div></header>
  <div class="cols">
    <section><h2 class="mitc">Most Important Tasks</h2>
      ${mits.map((t, i) => `<div class="mit"><span class="tick"></span><div>
        <div><b>MIT ${i + 1} · ${esc(t.title_snapshot)}</b></div>
        ${t.output_goal ? `<div>Output: ${esc(t.output_goal)}</div>` : ""}
        ${t.steps.length ? `<div class="muted">Steps: ${t.steps.map(s => esc(s.text)).join(" · ")}</div>` : ""}
      </div></div>`).join("") || '<p class="muted">No MITs picked.</p>'}
    </section>
    <section><h2>MIT time blocks</h2>
      ${blocks.map(x => `<div class="block"><b>${hhmm(x.t.starts_at)}–${hhmm(x.t.ends_at)}</b><span>MIT ${x.i + 1}</span></div>`).join("") || '<p class="muted">No time blocked yet.</p>'}
      ${also.length ? `<h2 style="margin-top:14px">Also on today</h2>${also.map(t => `<div class="li"><span class="tick"></span>${esc(t.title_snapshot)}</div>`).join("")}` : ""}
    </section>
  </div>
  <section><h2 class="green">Grateful for</h2>
    <div class="grat">${[1, 2, 3, 4].map(n => `<div>${esc((d.gratitude.find(g => g.position === n) || {}).statement || "")}</div>`).join("")}</div>
  </section>
  <div class="cols">
    <section><h2 class="green">Less Important Tasks</h2>
      <div class="list">${lits.map(t => `<div class="li"><span class="tick"></span>${esc(t.title_snapshot)}</div>`).join("") || '<p class="muted">None picked.</p>'}</div>
    </section>
    <section><h2>Habits to honour</h2>
      ${d.habits.map(h => `<div class="li" style="margin-bottom:6px"><span class="tick"></span>${esc(h.name)}</div>`).join("")}
    </section>
  </div>
  ${morning ? `<footer><div class="eyebrow">From this morning's journal</div><div>${esc(morning.transcript.split("\n")[0].slice(0, 220))}</div></footer>` : ""}`;
}
document.getElementById("print").addEventListener("click", async () => {
  window.print();
  fetch("/api/day/printed", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include", body: JSON.stringify({ date }) }).catch(() => {});
});
main();
</script>
</body>
</html>
